name: Bug report
description: Something in orpc-inspector does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please search existing issues first.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a minimal repository or StackBlitz that reproduces the bug.
      placeholder: https://github.com/you/repro
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm dev`
        2. Open the oRPC panel
        3. ...
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      description: How is orpc-inspector integrated? Include your UI framework in Environment below.
      options:
        - Vite (Vue / React / other frameworks)
        - Nuxt
        - Other / Not sure
    validations:
      required: true
  - type: dropdown
    id: affected-side
    attributes:
      label: Affected side
      description: Which side is affected? Select Not sure if you cannot tell.
      options:
        - Browser
        - SSR
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of orpc-inspector, @orpc/client, Vite or Nuxt, your UI framework, Node.js and the browser.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console or dev server output, if any.
      render: text
