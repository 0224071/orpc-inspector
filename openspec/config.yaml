schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords as is.

  Project: orpc-inspector — DevTools for inspecting oRPC calls, MIT, pnpm workspace.
  Publishes a single package `orpc-inspector` (packages/orpc-inspector) with subpaths `.` (recorder), `./vite`, `./nuxt`.
  The core must not depend on Nuxt; Vue is only used for the panel SPA and the Nuxt integration.
  Panel: a prebuilt Vue SPA mounted via iframe in the Vite DevTools dock; without a dock, the Vite plugin injects a floating panel.
  Page ↔ panel communication goes over the devframe in-page channel.
  oRPC v1 is supported (@orpc/client ^1.16); the recorder core is separate from the link plugin interface, leaving room for v2.
  SSR: the core provides a per-request collector + serialize()/hydrate(), wired up in the Nuxt module.

